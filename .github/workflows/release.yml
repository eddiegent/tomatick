name: Release

# How to publish a release:
#   1. Set the same version in package.json, src-tauri/Cargo.toml and
#      src-tauri/tauri.conf.json (and refresh the lock files), then merge it.
#   2. Tag the commit and push the tag:  git tag v0.1.0 && git push origin v0.1.0
#   3. This workflow builds the installers and attaches them to a DRAFT release.
#      Check the files, then publish the draft from the GitHub Releases page.
#
# Pull requests that touch this file or the Tauri config run the same builds
# without creating a release, and keep the installers as workflow artifacts.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src-tauri/tauri.conf.json
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-version:
    name: Check the tag matches the version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compare the tag with the three version files
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          npm_version=$(node -p "require('./package.json').version")
          tauri_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag=$tag package.json=$npm_version tauri.conf.json=$tauri_version Cargo.toml=$cargo_version"
          status=0
          for found in "$npm_version" "$tauri_version" "$cargo_version"; do
            if [ "$found" != "$tag" ]; then status=1; fi
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::The tag ${GITHUB_REF_NAME} does not match the version in package.json, tauri.conf.json and Cargo.toml."
          fi
          exit "$status"

  build:
    name: Build (${{ matrix.name }})
    needs: [check-version]
    # Runs for tags once the version check passed, and for the other triggers
    # where that check is skipped.
    if: ${{ !cancelled() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            args: --bundles appimage,deb
            rust-targets: ""
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            rust-targets: ""
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the installers
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Stripping fails on some recent Linux toolchains while building the AppImage.
          NO_STRIP: true
        with:
          # Only a tag creates a release. Other runs just build.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Tomatick {0}', github.ref_name) || '' }}
          releaseBody: |
            Installers for Windows, macOS and Linux.

            These builds are not code-signed yet. Windows SmartScreen and macOS Gatekeeper
            will show a warning the first time you open the app. The install notes in the
            documentation explain how to proceed.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Keep the installers of a test run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
